[project]
name = "backend"
version = "0.1.0"
description = "KnowledgeForge API"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "openai>=3.3.1",
    "pg8000>=1.31.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.0",
    "reportlab>=5.0.1",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.1.4",
    "torch==2.11.0",
    "uvicorn>=0.52.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
